service: laravel-skeleton

image: 99linesofcode/laravel-skeleton

registry:
  server: ghcr.io
  username: 99linesofcode
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  args:
    APP_URL: "https://playground.99linesofcode.nl"
  multiarch: false

config_file: ./deploy.yml

ssh:
  user: jordy

healthcheck:
  path: /healthz
  port: 80

servers:
  web:
    hosts:
      - 213.165.72.226
    traefik: false # disable setting up traefik load balancer for this container
    labels:
      traefik.enable: true
      traefik.tcp.routers.web.rule: HostSNI(`playground.99linesofcode.nl`)
      traefik.tcp.routers.web.tls.passthrough: true
      traefik.tcp.services.web.loadbalancer.server.port: 443
    options:
      network: "server01.net" # necessary when adding new services to a preexisting load balancer

accessories:
  mysql:
    image: mysql/mysql-server:8.0
    host: 213.165.72.226
    env:
      secret:
        - MYSQL_ROOT_PASSWORD
        - MYSQL_ROOT_HOST
        - MYSQL_DATABASE
        - MYSQL_USER
        - MYSQL_PASSWORD
  redis:
    image: redis:alpine
    roles:
      - web
  meilisearch:
    image: getmeili/meilisearch:latest
    host: 213.165.72.226
  soketi:
    image: quay.io/soketi/soketi:latest
    host: 213.165.72.226
    env:
      clear:
        - SOKETI_DEBUG
        - SOKETI_METRICS_SERVER_PORT
        - SOKETI_DEFAULT_APP_ID
        - SOKETI_DEFAULT_APP_KEY
        - SOKETI_DEFAULT_APP_SECRET
