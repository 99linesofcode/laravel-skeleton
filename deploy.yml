service: laravel-skeleton

image: 99linesofcode/laravel-skeleton

builder:
  multiarch: false
config_file: ./deploy.yml
ssh:
  user: jordy

servers:
  web:
    hosts:
      - 213.165.72.226

registry:
  server: ghcr.io
  username: 99linesofcode
  password:
    - KAMAL_REGISTRY_PASSWORD
  options:
    network: "server01.net"

healthcheck:
  path: /healthz
  port: 80

traefik:
  ports:
    - 443
  publish: false

accessories:
  mysql:
    host: 213.165.72.226
    image: mysql/mysql-server:8.0
    ports:
      - 3306:3306
    env:
      clear:
        MYSQL_ROOT_PASSWORD: "secret"
        MYSQL_ROOT_HOST: "%"
        MYSQL_DATABASE: "default"
        MYSQL_USER: "default"
        MYSQL_PASSWORD: "secret"
    options:
      network: "server01.net"
  redis:
    image: redis:alpine
    roles:
      - web
    options:
      network: "server01.net"
  meilisearch:
    host: 213.165.72.226
    image: getmeili/meilisearch:latest
    ports:
      - 7700:7700
    options:
      network: "server01.net"
  soketi:
    host: 213.165.72.226
    image: quay.io/soketi/soketi:latest
    ports:
      - 6001:6001
      - 9601:9601
    env:
      clear:
        SOKETI_DEBUG: -1
        SOKETI_METRICS_SERVER_PORT: 9601
        SOKETI_DEFAULT_APP_ID: "app-id"
        SOKETI_DEFAULT_APP_KEY: "app-key"
        SOKETI_DEFAULT_APP_SECRET: "app-secret"
    options:
      network: "server01.net"
