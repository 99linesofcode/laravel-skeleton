service: laravel-skeleton

image: 99linesofcode/laravel-skeleton

registry:
  server: ghcr.io
  username: 99linesofcode
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  multiarch: false

config_file: ./deploy.yml

ssh:
  user: jordy

healthcheck:
  path: /healthz
  port: 80

servers:
  web:
    hosts:
      - 213.165.72.226
    labels:
      traefik.enable: true
      traefik.tcp.routers.web.rule: HostSNI(`playground.99linesofcode.nl`)
      traefik.tcp.routers.web.tls.passthrough: true
      traefik.tcp.services.web.loadbalancer.server.port: 443

traefik:
  env:
    secret:
      - CLOUDFLARE_EMAIL
      - CLOUDFLARE_DNS_API_TOKEN
  options:
    publish:
      - 443:443
    volume:
      - /home/jordy/.config/traefik:/config
  args:
    # accesslog: true
    # log.level: DEBUG
    providers.docker: true
    providers.docker.exposedbydefault: false
    entrypoints.web.address: ":80"
    entrypoints.web.http.redirections.entryPoint.to: websecure
    entrypoints.web.http.redirections.entryPoint.scheme: https
    entrypoints.web.http.redirections.entryPoint.permanent: true
    entrypoints.websecure.address: ":443"
    # entrypoints.websecure.asDefault: true
    certificatesresolvers.letsencrypt.acme.email: jordy@schreuders.it
    certificatesresolvers.letsencrypt.acme.storage: /config/acme.json
    certificatesresolvers.letsencrypt.acme.dnschallenge: true
    certificatesresolvers.letsencrypt.acme.dnschallenge.provider: cloudflare
    certificatesresolvers.letsencrypt.acme.dnschallenge.delaybeforecheck: 0
    certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers: 1.1.1.1,9.9.9.9,8.8.8.8
    # certificatesresolvers.letsencrypt.acme.caServer: https://acme-staging-v02.api.letsencrypt.org/directory

accessories:
  mysql:
    image: mysql/mysql-server:8.0
    host: 213.165.72.226
    env:
      secret:
        - MYSQL_ROOT_PASSWORD
        - MYSQL_ROOT_HOST
        - MYSQL_DATABASE
        - MYSQL_USER
        - MYSQL_PASSWORD
  redis:
    image: redis:alpine
    roles:
      - web
  meilisearch:
    image: getmeili/meilisearch:latest
    host: 213.165.72.226
  soketi:
    image: quay.io/soketi/soketi:latest
    host: 213.165.72.226
    env:
      clear:
        - SOKETI_DEBUG
        - SOKETI_METRICS_SERVER_PORT
        - SOKETI_DEFAULT_APP_ID
        - SOKETI_DEFAULT_APP_KEY
        - SOKETI_DEFAULT_APP_SECRET
