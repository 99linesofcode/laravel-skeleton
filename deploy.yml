service: laravel-skeleton

image: 99linesofcode/laravel-skeleton

builder:
  multiarch: false

config_file: ./deploy.yml

env:
  secret:
    - CLOUDFLARE_DNS_API_TOKEN
    - SERVER_NAME

healthcheck:
  path: /healthz
  port: 80
  max_attempts: 12
  interval: 20s

registry:
  server: ghcr.io
  username: 99linesofcode
  password:
    - CONTAINER_REGISTRY_PASSWORD

ssh:
  user: jordy

servers:
  web:
    hosts:
      - 213.165.72.226
    traefik: false # disabled because in my default configuration we are already behind an existing Traefik proxy (server01)
    labels:
      traefik.enable: true
      traefik.tcp.routers.web.rule: HostSNI(`playground.99linesofcode.nl`) # should be identical to $APP_URL
      traefik.tcp.routers.web.tls.passthrough: true
      traefik.tcp.services.web.loadbalancer.server.port: 443
    options:
      network: "server01.net" # necessary when adding services to a pre-existing load balancer

accessories:
  mysql:
    image: mysql/mysql-server:8.0
    host: 213.165.72.226
    env:
      secret:
        - MYSQL_ROOT_PASSWORD
        - MYSQL_DATABASE
        - MYSQL_USER
        - MYSQL_PASSWORD
    volumes:
      - vol.mysql:/data
    options:
      network: "server01.net" # necessary when adding services to a pre-existing load balancer
  redis:
    image: redis:alpine
    roles:
      - web
    volumes:
      - vol.redis:/data
    options:
      network: "server01.net" # necessary when adding services to a pre-existing load balancer
  meilisearch:
    image: getmeili/meilisearch:latest
    host: 213.165.72.226
    volumes:
      - vol.meilisearch:/data
    options:
      network: "server01.net" # necessary when adding services to a pre-existing load balancer
  soketi:
    image: quay.io/soketi/soketi:latest-16-alpine
    host: 213.165.72.226
    env:
      secret:
        - SOKETI_DEBUG
        - SOKETI_METRICS_SERVER_PORT
        - SOKETI_DEFAULT_APP_ID
        - SOKETI_DEFAULT_APP_KEY
        - SOKETI_DEFAULT_APP_SECRET
    options:
      network: "server01.net" # necessary when adding services to a pre-existing load balancer
